<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarking API Frontend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .form-container {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        .hidden-form {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
        }
        .visible-form {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">My Bookmarks</h1>
            <p class="text-gray-600">Your personal space to save and manage links.</p>
        </header>

        <!-- Authentication Section -->
        <div id="auth-section" class="max-w-md mx-auto">
            <div class="bg-white rounded-lg shadow-md p-8 relative overflow-hidden">
                <!-- Login Form -->
                <div id="login-form-container" class="form-container visible-form">
                    <h2 class="text-2xl font-semibold mb-4 text-center">Login</h2>
                    <form id="login-form">
                        <div class="mb-4">
                            <label for="login-email" class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" id="login-email" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="mb-6">
                            <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                            <input type="password" id="login-password" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Login</button>
                    </form>
                    <p class="text-center text-sm mt-4">
                        Don't have an account? <a href="#" id="show-register" class="font-medium text-indigo-600 hover:text-indigo-500">Register here</a>
                    </p>
                </div>

                <!-- Register Form -->
                <div id="register-form-container" class="form-container hidden-form">
                    <h2 class="text-2xl font-semibold mb-4 text-center">Register</h2>
                    <form id="register-form">
                         <div class="mb-4">
                            <label for="register-name" class="block text-sm font-medium text-gray-700">Name</label>
                            <input type="text" id="register-name" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="mb-4">
                            <label for="register-email" class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" id="register-email" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="mb-6">
                            <label for="register-password" class="block text-sm font-medium text-gray-700">Password</label>
                            <input type="password" id="register-password" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Register</button>
                    </form>
                    <p class="text-center text-sm mt-4">
                        Already have an account? <a href="#" id="show-login" class="font-medium text-indigo-600 hover:text-indigo-500">Login here</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Bookmarks Section (hidden by default) -->
        <div id="bookmarks-section" class="hidden">
            <div class="flex justify-between items-center mb-6">
                 <h2 class="text-3xl font-semibold">Your Bookmarks</h2>
                 <button id="logout-btn" class="bg-red-500 text-white py-2 px-4 rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">Logout</button>
            </div>

            <!-- Add/Edit Bookmark Form -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                 <form id="bookmark-form">
                    <input type="hidden" id="bookmark-id">
                    <h3 id="form-title" class="text-xl font-semibold mb-4">Add a New Bookmark</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="bookmark-title" class="block text-sm font-medium text-gray-700">Title</label>
                            <input type="text" id="bookmark-title" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="bookmark-url" class="block text-sm font-medium text-gray-700">URL</label>
                            <input type="url" id="bookmark-url" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    </div>
                    <div class="mt-4 flex items-center space-x-4">
                         <button type="submit" class="bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700">Save Bookmark</button>
                         <button type="button" id="cancel-edit-btn" class="hidden bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300">Cancel Edit</button>
                    </div>
                </form>
            </div>
           
            <!-- Bookmarks List -->
            <div id="bookmarks-list" class="space-y-4">
                <!-- Bookmarks will be inserted here by JavaScript -->
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white py-2 px-4 rounded-lg shadow-lg opacity-0 transition-opacity duration-300">
            <p id="toast-message"></p>
        </div>

    </div>

    <script>
        // --- CONFIG ---
        const API_BASE_URL = 'http://localhost:3000/api';
        let token = null;

        // --- DOM ELEMENTS ---
        const authSection = document.getElementById('auth-section');
        const bookmarksSection = document.getElementById('bookmarks-section');
        const loginFormContainer = document.getElementById('login-form-container');
        const registerFormContainer = document.getElementById('register-form-container');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const bookmarkForm = document.getElementById('bookmark-form');
        const bookmarksList = document.getElementById('bookmarks-list');
        const logoutBtn = document.getElementById('logout-btn');
        const showRegisterLink = document.getElementById('show-register');
        const showLoginLink = document.getElementById('show-login');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const formTitle = document.getElementById('form-title');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // --- STATE MANAGEMENT ---
        const checkAuthState = () => {
            token = localStorage.getItem('authToken');
            if (token) {
                showBookmarksView();
                getBookmarks();
            } else {
                showAuthView();
            }
        };

        const setToken = (newToken) => {
            token = newToken;
            localStorage.setItem('authToken', newToken);
        };

        const clearToken = () => {
            token = null;
            localStorage.removeItem('authToken');
        };

        // --- UI TOGGLING ---
        const showAuthView = () => {
            authSection.classList.remove('hidden');
            bookmarksSection.classList.add('hidden');
        };

        const showBookmarksView = () => {
            authSection.classList.add('hidden');
            bookmarksSection.classList.remove('hidden');
        };

        const toggleAuthForms = () => {
            loginFormContainer.classList.toggle('hidden-form');
            loginFormContainer.classList.toggle('visible-form');
            registerFormContainer.classList.toggle('hidden-form');
            registerFormContainer.classList.toggle('visible-form');
        };
        
        const showToast = (message, isError = false) => {
            toastMessage.textContent = message;
            toast.className = `fixed bottom-5 right-5 text-white py-2 px-4 rounded-lg shadow-lg transition-opacity duration-300 ${isError ? 'bg-red-500' : 'bg-gray-800'}`;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        };

        // --- API CALLS ---

        // Register User
        const registerUser = async (name, email, password) => {
            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'Registration failed');
                }
                showToast('Registration successful! Please log in.');
                toggleAuthForms();
                registerForm.reset();
            } catch (error) {
                showToast(error.message, true);
            }
        };

        // Login User
        const loginUser = async (email, password) => {
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'Login failed');
                }
                const data = await response.json();
                setToken(data.token);
                checkAuthState();
            } catch (error) {
                showToast(error.message, true);
            }
        };

        // Get Bookmarks
        const getBookmarks = async () => {
            try {
                const response = await fetch(`${API_BASE_URL}/bookmarks`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed to fetch bookmarks');
                const bookmarks = await response.json();
                renderBookmarks(bookmarks);
            } catch (error) {
                showToast(error.message, true);
            }
        };

        // Create Bookmark
        const createBookmark = async (title, url) => {
            try {
                const response = await fetch(`${API_BASE_URL}/bookmarks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, url })
                });
                if (!response.ok) throw new Error('Failed to create bookmark');
                getBookmarks(); // Refresh the list
                bookmarkForm.reset();
                showToast('Bookmark created!');
            } catch (error) {
                showToast(error.message, true);
            }
        };

        // Update Bookmark
        const updateBookmark = async (id, title, url) => {
            try {
                const response = await fetch(`${API_BASE_URL}/bookmarks/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, url })
                });
                if (!response.ok) throw new Error('Failed to update bookmark');
                getBookmarks(); // Refresh the list
                resetBookmarkForm();
                showToast('Bookmark updated!');
            } catch (error) {
                showToast(error.message, true);
            }
        };
        
        // Delete Bookmark
        const deleteBookmark = async (id) => {
            if (!confirm('Are you sure you want to delete this bookmark?')) return;
            try {
                 const response = await fetch(`${API_BASE_URL}/bookmarks/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed to delete bookmark');
                getBookmarks(); // Refresh the list
                showToast('Bookmark deleted.');
            } catch (error) {
                showToast(error.message, true);
            }
        };

        // --- RENDERING ---
        const renderBookmarks = (bookmarks) => {
            bookmarksList.innerHTML = '';
            if (bookmarks.length === 0) {
                bookmarksList.innerHTML = `<p class="text-center text-gray-500">You don't have any bookmarks yet. Add one above!</p>`;
                return;
            }
            bookmarks.forEach(bookmark => {
                const bookmarkEl = document.createElement('div');
                bookmarkEl.className = 'bg-white p-4 rounded-lg shadow-md flex items-center justify-between';
                bookmarkEl.innerHTML = `
                    <div>
                        <h4 class="font-semibold text-lg">${bookmark.title}</h4>
                        <a href="${bookmark.url}" target="_blank" class="text-indigo-600 hover:underline text-sm">${bookmark.url}</a>
                    </div>
                    <div class="flex space-x-2">
                        <button class="edit-btn p-2 text-gray-500 hover:text-indigo-600" data-id="${bookmark.id}" data-title="${bookmark.title}" data-url="${bookmark.url}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" /></svg>
                        </button>
                        <button class="delete-btn p-2 text-gray-500 hover:text-red-600" data-id="${bookmark.id}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                `;
                bookmarksList.appendChild(bookmarkEl);
            });
        };
        
        const populateEditForm = (id, title, url) => {
            document.getElementById('bookmark-id').value = id;
            document.getElementById('bookmark-title').value = title;
            document.getElementById('bookmark-url').value = url;
            formTitle.textContent = 'Edit Bookmark';
            cancelEditBtn.classList.remove('hidden');
        };
        
        const resetBookmarkForm = () => {
             document.getElementById('bookmark-id').value = '';
             bookmarkForm.reset();
             formTitle.textContent = 'Add a New Bookmark';
             cancelEditBtn.classList.add('hidden');
        };

        // --- EVENT LISTENERS ---
        showRegisterLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleAuthForms();
        });

        showLoginLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleAuthForms();
        });

        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            registerUser(name, email, password);
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            loginUser(email, password);
        });
        
        logoutBtn.addEventListener('click', () => {
            clearToken();
            checkAuthState();
        });
        
        bookmarkForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('bookmark-id').value;
            const title = document.getElementById('bookmark-title').value;
            const url = document.getElementById('bookmark-url').value;

            if (id) { // If there's an ID, we're updating
                updateBookmark(id, title, url);
            } else { // Otherwise, we're creating
                createBookmark(title, url);
            }
        });
        
        bookmarksList.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.edit-btn');
            const deleteBtn = e.target.closest('.delete-btn');

            if (editBtn) {
                const { id, title, url } = editBtn.dataset;
                populateEditForm(id, title, url);
                window.scrollTo(0,0);
            }

            if (deleteBtn) {
                const { id } = deleteBtn.dataset;
                deleteBookmark(id);
            }
        });
        
        cancelEditBtn.addEventListener('click', resetBookmarkForm);

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', checkAuthState);

    </script>
</body>
</html>
